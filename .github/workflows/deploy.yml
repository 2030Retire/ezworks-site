name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Optional. When unset the contact form falls back to a mailto: draft.
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}

      # The custom domain lives at public/CNAME, so `next build` copies it into
      # out/. Fail loudly rather than publishing a build that would drop
      # ezworks.co back to the github.io domain.
      - name: Verify CNAME survived the export
        run: |
          test -f out/CNAME || { echo "out/CNAME missing"; exit 1; }
          grep -qx 'ezworks.co' out/CNAME || { echo "out/CNAME is not ezworks.co"; exit 1; }

      # GitHub Pages would otherwise run Jekyll and drop _-prefixed paths.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
